<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Jersey+25&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Slabo+27px&display=swap"
		rel="stylesheet">
	<title>
		Library of DAIT
	</title>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>
<style>
	/* 1. Reset Global yang Benar dan Aman */
	html,
	body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		box-sizing: border-box;
		overflow-x: hidden;
		overflow-y: auto;
		scrollbar-gutter: stable;
	}

	html {
		background-color: black;
		scroll-margin-top: 6vh;
		scroll-behavior: smooth;
	}

	*,
	*::before,
	*::after {
		box-sizing: inherit;
		/* Ini jauh lebih aman */
		margin: 0;
		padding: 0;
	}

	/* 2. Font Global */
	body {
		font-family: "Rajdhani", sans-serif;
	}

	/* 3. Debugging Border (Opsional untuk nyari layout bocor) */
	*:not(html):not(body) {
		/* outline: 0.01px solid red; */
	}
</style>

</html>
